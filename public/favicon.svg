<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" fill="#050505"/>
  
  <!-- iPhone body with gradient -->
  <defs>
    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0a0a0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E0E11;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer iPhone frame -->
  <rect x="12" y="6" width="40" height="52" rx="5" fill="url(#phoneGradient)" stroke="#666" stroke-width="0.5"/>
  
  <!-- Screen -->
  <rect x="14" y="9" width="36" height="42" rx="3.5" fill="url(#screenGradient)"/>
  
  <!-- Notch -->
  <rect x="22" y="9" width="20" height="4" rx="2" fill="#050505"/>
  
  <!-- Screen content - subtle design elements -->
  <g opacity="0.6">
    <!-- Top bar -->
    <line x1="16" y1="15" x2="48" y2="15" stroke="#555" stroke-width="0.5"/>
    
    <!-- Card elements representing app interface -->
    <rect x="16" y="18" width="13" height="7" rx="1" fill="#1a3a4a" opacity="0.7"/>
    <rect x="31" y="18" width="13" height="7" rx="1" fill="#2a5a6a" opacity="0.7"/>
    
    <!-- Dashboard lines -->
    <line x1="16" y1="28" x2="48" y2="28" stroke="#444" stroke-width="0.3"/>
    <line x1="16" y1="31" x2="35" y2="31" stroke="#555" stroke-width="0.3"/>
    <line x1="16" y1="34" x2="48" y2="34" stroke="#444" stroke-width="0.3"/>
    <line x1="16" y1="37" x2="42" y2="37" stroke="#555" stroke-width="0.3"/>
    
    <!-- Accent circles (data points) -->
    <circle cx="32" cy="32" r="1" fill="#e8a0ff" opacity="0.8"/>
    <circle cx="38" cy="30" r="0.8" fill="#a0e8ff" opacity="0.8"/>
  </g>
  
  <!-- Home indicator -->
  <rect x="26" y="50" width="12" height="1" rx="0.5" fill="#444"/>
  
  <!-- Gloss effect on top -->
  <rect x="14" y="9" width="36" height="6" rx="3.5" fill="white" opacity="0.08"/>
</svg>
